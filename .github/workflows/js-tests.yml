name: JS Unit Tests

on:
  pull_request:
    paths:
      - 'js/core/**'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'js/core/**'
      - 'tests/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node --test tests/

name: Validate Material JSON

on:
  pull_request:
    paths:
      - 'materials/**'
      - 'schema/**'
      - 'references/index.json'
      - 'tools/validate.py'
      - 'tools/update_manifest.py'
      - 'tools/lint_physics.py'
  push:
    branches: [main]
    paths:
      - 'materials/**'
      - 'schema/**'
      - 'references/index.json'
      - 'tools/validate.py'
      - 'tools/update_manifest.py'
      - 'tools/lint_physics.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - run: python tools/validate.py

      # Catches a contributor who forgot CONTRIBUTING.md step 7 (regenerate
      # the manifest before opening the PR) as well as merge-commit drift on
      # main. The comparison ignores the "generated" timestamp field —
      # update_manifest.py stamps that with the current time on every run,
      # so a raw `git diff`/`diff -q` here would fail on every single CI run
      # regardless of whether the material data actually changed.
      - name: Manifest is up to date
        run: |
          cp materials/index.json /tmp/manifest_before.json
          python tools/update_manifest.py > /dev/null
          python - <<'EOF'
          import json, sys
          with open('/tmp/manifest_before.json', encoding='utf-8') as f:
              before = json.load(f)['materials']
          with open('materials/index.json', encoding='utf-8') as f:
              after = json.load(f)['materials']
          if before != after:
              print('materials/index.json is out of date (ignoring the generated timestamp).')
              print('Run: python tools/update_manifest.py, then commit the result.')
              sys.exit(1)
          print('OK: manifest matches the current materials/ content')
          EOF

      # Advisory only, by design: schema validation checks shape, not physics
      # (the 2026-08-20 fatigue audit found schema-valid data that was wrong
      # for months). This is a sanity net, not a gate — always exits 0, so
      # `|| true` isn't needed, but shown in the workflow log either way.
      - name: Physical plausibility lint (advisory, non-blocking)
        run: python tools/lint_physics.py

      # new_references blocks are legitimate on PR branches (the submit-form
      # workflow embeds them), but must not linger on main — an unpromoted key
      # breaks that material's citation links on the live site. Fix: run
      # `python tools/import_new_refs.py --write`, then delete the
      # new_references block from the listed file(s).
      - name: No lingering new_references on main
        if: github.event_name == 'push'
        run: |
          python - <<'EOF'
          import json, glob, sys
          offenders = []
          for f in glob.glob('materials/**/*.json', recursive=True):
              if f.endswith('index.json'):
                  continue
              with open(f, encoding='utf-8') as fh:
                  if 'new_references' in json.load(fh):
                      offenders.append(f)
          if offenders:
              print('new_references block(s) still present on main:')
              for f in offenders:
                  print('  ', f)
              print('Run: python tools/import_new_refs.py --write, then remove the block(s).')
              sys.exit(1)
          print('OK: no lingering new_references')
          EOF

name: Validate Material JSON

on:
  pull_request:
    paths:
      - 'materials/**'
      - 'schema/**'
      - 'references/index.json'
      - 'tools/validate.py'
  push:
    branches: [main]
    paths:
      - 'materials/**'
      - 'schema/**'
      - 'references/index.json'
      - 'tools/validate.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - run: python tools/validate.py

      # Advisory only, by design: schema validation checks shape, not physics
      # (the 2026-08-20 fatigue audit found schema-valid data that was wrong
      # for months). This is a sanity net, not a gate — always exits 0, so
      # `|| true` isn't needed, but shown in the workflow log either way.
      - name: Physical plausibility lint (advisory, non-blocking)
        run: python tools/lint_physics.py

      # new_references blocks are legitimate on PR branches (the submit-form
      # workflow embeds them), but must not linger on main — an unpromoted key
      # breaks that material's citation links on the live site. Fix: run
      # `python tools/import_new_refs.py --write`, then delete the
      # new_references block from the listed file(s).
      - name: No lingering new_references on main
        if: github.event_name == 'push'
        run: |
          python - <<'EOF'
          import json, glob, sys
          offenders = []
          for f in glob.glob('materials/**/*.json', recursive=True):
              if f.endswith('index.json'):
                  continue
              with open(f, encoding='utf-8') as fh:
                  if 'new_references' in json.load(fh):
                      offenders.append(f)
          if offenders:
              print('new_references block(s) still present on main:')
              for f in offenders:
                  print('  ', f)
              print('Run: python tools/import_new_refs.py --write, then remove the block(s).')
              sys.exit(1)
          print('OK: no lingering new_references')
          EOF

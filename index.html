<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVIC Engineering Materials Database</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Browse and filter engineering material properties for metals, plastics, ceramics, composites, elastomers, glass, and natural materials.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UVIC Engineering Materials Database">
  <meta property="og:title" content="Browse Materials — UVIC MatDB">
  <meta property="og:description" content="Browse and filter engineering material properties for metals, plastics, ceramics, composites, elastomers, glass, and natural materials.">
  <meta property="og:url" content="https://scroberts.github.io/Engineering-Materials-Database/">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/browse.css">
  <script data-goatcounter="https://scottroberts8314.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="site-title">
        <h1>Materials Database</h1>
        <span class="site-subtitle">UVIC Design Engineering</span>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html"    class="nav-link active">Browse</a>
        <a href="select.html"   class="nav-link">Advanced Selection</a>
        <a href="compare.html"  class="nav-link">Compare</a>
        <a href="submit.html"   class="nav-link">Submit</a>
        <button class="nav-link" data-action="show-disclaimer">Disclaimer</button>
      </nav>
    </div>
  </header>

  <div class="browse-layout">

    <!-- Filter sidebar -->
    <aside class="filter-sidebar" id="filter-sidebar" aria-label="Filter materials">

      <div class="filter-section">
        <label for="search-input" class="filter-heading">Search</label>
        <input type="search" id="search-input" class="filter-search"
               placeholder="Material name…" autocomplete="off">
      </div>

      <div class="filter-section">
        <p class="filter-heading">Category</p>
        <div class="checkbox-group" id="filter-category">
          <!-- populated by browse.js -->
        </div>
      </div>

      <div class="filter-section">
        <p class="filter-heading">Fabrication Process</p>
        <div class="checkbox-group" id="filter-fabrication">
          <!-- populated by browse.js -->
        </div>
      </div>

      <div class="filter-section">
        <p class="filter-heading">Common Forms</p>
        <div class="checkbox-group" id="filter-forms">
          <!-- populated by browse.js -->
        </div>
      </div>

      <div class="filter-section">
        <h3 class="filter-heading">Usage Frequency</h3>
        <div id="filter-frequency">
          <!-- populated by browse.js -->
        </div>
      </div>

      <div class="filter-section">
        <p class="filter-heading">Magnetic Class</p>
        <div class="checkbox-group" id="filter-magnetic">
          <!-- populated by browse.js -->
        </div>
      </div>

      <div class="filter-section">
        <button class="filter-reset" id="filter-reset" type="button">
          Clear all filters
        </button>
        <button class="btn-advanced-select" id="btn-advanced-select" type="button">
          Advanced Selection →
        </button>
      </div>

    </aside>

    <!-- Main content -->
    <main class="browse-main">
      <div class="browse-toolbar">
        <span class="result-count" id="result-count"></span>
      </div>
      <div class="materials-grid" id="materials-grid" role="list">
        <!-- populated by browse.js -->
      </div>
    </main>

  </div>

  <!-- Compare bar (appears when materials are selected) -->
  <div class="compare-bar" id="compare-bar" hidden role="status">
    <span class="compare-bar-count" id="compare-count"></span>
    <button class="compare-bar-btn" id="btn-compare" type="button">
      Compare →
    </button>
    <button class="compare-bar-btn compare-bar-btn-secondary" id="btn-compare-all-filtered"
            type="button" hidden>
      Compare All Filtered →
    </button>
    <button class="compare-bar-clear" id="btn-clear-compare" type="button">
      Clear
    </button>
  </div>

  <script type="module" src="js/core/disclaimer.js"></script>
  <script type="module" src="js/pages/browse.js"></script>
</body>
</html>
